<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;700;800&family=Bodoni+Moda:opsz,wght@6..96,500&display=swap" rel="stylesheet">
<style>
:root{--paper:#F1F3EE;--ink:#0E2B2A;--green:#3D7A68;--violet:#6B5CA5;--rule:#C8D0C8;--sheet:#FBFCF9}
*{box-sizing:border-box;margin:0}
body{width:1200px;height:900px;background:#DCE3DC;font-family:'Schibsted Grotesk';color:var(--ink);display:grid;place-items:center;overflow:hidden}
.sheet{width:860px;background:var(--sheet);padding:56px 60px 48px;transform:rotate(-2.2deg);box-shadow:0 1px 0 var(--rule),0 30px 60px -30px rgba(14,43,42,.35);position:relative}
.sheet:before{content:"";position:absolute;inset:14px;border:1px solid var(--rule)}
.top{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:2px solid var(--ink);padding-bottom:18px}
.brand{font-weight:800;font-size:30px;letter-spacing:-.03em}
.meta{font-size:15px;color:#4F6662;text-align:right;line-height:1.5}
table{width:100%;border-collapse:collapse;margin-top:22px;font-size:18px}
th{font-weight:500;font-size:14px;color:#4F6662;text-align:left;padding:8px 0;border-bottom:1px solid var(--rule)}
td{padding:15px 0;border-bottom:1px solid var(--rule)}
td.n,th.n{text-align:right;font-family:"Schibsted Grotesk";font-feature-settings:"lnum"}
.cur{display:inline-block;font-size:13px;font-weight:700;color:var(--green);border:1px solid var(--green);padding:1px 6px;margin-right:10px}
.total td{border-bottom:0;border-top:2px solid var(--ink);font-weight:700;padding-top:20px}
.big{font-family:'Bodoni Moda';font-weight:500;font-size:44px;letter-spacing:-.01em}
.stamp{position:absolute;right:250px;top:-30px;background:transparent;width:130px;height:130px;border-radius:50%;border:2px solid var(--violet);color:var(--violet);display:grid;place-items:center;text-align:center;font-weight:700;font-size:13px;line-height:1.3;transform:rotate(-14deg);opacity:.85}
.stamp:before{content:"";position:absolute;inset:7px;border-radius:50%;border:1px dashed var(--violet)}
</style></head><body>
<div class="sheet">
  <div class="top"><div class="brand">orvane</div><div class="meta">Consolidated position<br>All entities, all banks</div></div>
  <table>
    <tr><th>Entity</th><th>Accounts</th><th class="n">Balance, GBP equivalent</th></tr>
    <tr><td><span class="cur">GBP</span>Holdings Ltd</td><td>4</td><td class="n">21,402,118.40</td></tr>
    <tr><td><span class="cur">EUR</span>Europe BV</td><td>5</td><td class="n">14,880,302.15</td></tr>
    <tr><td><span class="cur">USD</span>Americas Inc</td><td>3</td><td class="n">9,311,940.72</td></tr>
    <tr><td><span class="cur">CHF</span>Treasury AG</td><td>2</td><td class="n">2,622,568.73</td></tr>
    <tr class="total"><td>Group, in GBP</td><td>14</td><td class="n big">48,216,930</td></tr>
  </table>
  <div class="stamp">RECONCILED<br>0 exceptions</div>
</div></body></html>
